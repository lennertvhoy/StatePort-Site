# gh, fzf, and Node.js are not taken from the Ubuntu snapshot: the snapshot
# builds embed a stale Go toolchain with known stdlib vulnerabilities (and
# Ubuntu wont-fixes gh 2.45.0 CVE-2024-52308), Ubuntu's nodejs 18.19 is EOL,
# and its npm deb chain pulls vulnerable node-* library packages (handlebars,
# picomatch, babel7, http-cache-semantics) into /usr/share/nodejs. Pinned
# upstream release tarballs are fetched over TLS in the dev-workspace
# Containerfile and verified against these exact SHA-256 digests; any mismatch
# fails the build.
upstreamTools:
  gh:
    version: 2.97.0
    uri: https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz
    digest: sha256:a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
    installPath: /usr/local/bin/gh
  fzf:
    version: 0.74.2
    uri: https://github.com/junegunn/fzf/releases/download/v0.74.2/fzf-0.74.2-linux_amd64.tar.gz
    digest: sha256:b3648f48675612b69ee35371cf6dc99ca96d767e89b912d079080916ac8ba8bd
    installPath: /usr/local/bin/fzf
  node:
    version: 22.23.2
    uri: https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.gz
    digest: sha256:b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a
    installPath: /usr/local
  npm:
