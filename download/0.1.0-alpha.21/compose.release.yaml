services:
  stateport-web:
    image: ghcr.io/lennertvhoy/stateport-web@sha256:7d535d2b03b523826e4411b507d56b6e3765284cdd33c6b9eec14e8e5d5ca9ee
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8080'
      - --path
      - /health
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
    - 127.0.0.1:${STATEPORT_WEB_PORT:-8080}:8080
    volumes:
    - stateport-product-data:/var/lib/stateport
  stateport-api:
    image: ghcr.io/lennertvhoy/stateport-api@sha256:520b7d01402fae2dad43d80ff984d6daa2e389ac71d7519a81e617e9627e8779
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8790'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
  stateport-worker:
    image: ghcr.io/lennertvhoy/stateport-worker@sha256:7407cca5a86b1b96a3ed06d9464c2e4dd18be9955c47fc3c1039e1bf5a04eaea
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8791'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
networks:
  stateport:
    driver: bridge
volumes:
  stateport-operations: {}
  stateport-product-data: {}
