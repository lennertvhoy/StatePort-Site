services:
  stateport-web:
    image: ghcr.io/lennertvhoy/stateport-web@sha256:e09ab3f6aa6ac8316ed265c2d855ef35405253f0579d7033d1ff3f53cafc6591
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8080'
      - --path
      - /health
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
    - 127.0.0.1:${STATEPORT_WEB_PORT:-8080}:8080
    volumes:
    - stateport-product-data:/var/lib/stateport
  stateport-api:
    image: ghcr.io/lennertvhoy/stateport-api@sha256:bc15758766b9cceeb842b935415a12087bd5269c0cc5125ce939b4be0b0a11fc
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8790'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
  stateport-worker:
    image: ghcr.io/lennertvhoy/stateport-worker@sha256:84c21888edbbcb200d1d9df8b5f2c5c957af15a21afb47135854d7eae49f07bc
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8791'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
networks:
  stateport:
    driver: bridge
volumes:
  stateport-operations: {}
  stateport-product-data: {}
