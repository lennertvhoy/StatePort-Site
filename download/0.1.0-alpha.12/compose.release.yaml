services:
  stateport-web:
    image: ghcr.io/lennertvhoy/stateport-web@sha256:14becec41e36b3883886128c230a733ca333842824fea812e6b1f96e0c1df7c3
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8080'
      - --path
      - /health
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
    - 127.0.0.1:${STATEPORT_WEB_PORT:-8080}:8080
    volumes:
    - stateport-product-data:/var/lib/stateport
  stateport-api:
    image: ghcr.io/lennertvhoy/stateport-api@sha256:01de186713c69817c1c09e5a36d7f94a8a24031efaf0105153f86372525c9578
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8790'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
  stateport-worker:
    image: ghcr.io/lennertvhoy/stateport-worker@sha256:77e4f18306e9f43bb415bf0dd73c1c2645d39366908fed59ad93af43639d10f3
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8791'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
networks:
  stateport:
    driver: bridge
volumes:
  stateport-operations: {}
  stateport-product-data: {}
