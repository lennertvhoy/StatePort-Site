services:
  stateport-web:
    image: ghcr.io/lennertvhoy/stateport-web@sha256:925a98149a46e9aec49434e044fff24ab3ef4ad94b7c072efa3faf10a1d73e0a
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8080'
      - --path
      - /health
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
    - 127.0.0.1:${STATEPORT_WEB_PORT:-8080}:8080
    volumes:
    - stateport-product-data:/var/lib/stateport
  stateport-api:
    image: ghcr.io/lennertvhoy/stateport-api@sha256:88fafe75e878075d0f926fb11a730ba0b88bf2897782385e4afdad1523b58c6f
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8790'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
  stateport-worker:
    image: ghcr.io/lennertvhoy/stateport-worker@sha256:43071f0a2d0dcd4f928864e1398f9acaa3c9e26ff1915dd75eb878af5e7201a6
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - stateport
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/stateport-healthcheck
      - --kind
      - http
      - --host
      - 127.0.0.1
      - --port
      - '8791'
      - --path
      - /readyz
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - stateport-operations:/workspace/.stateport
networks:
  stateport:
    driver: bridge
volumes:
  stateport-operations: {}
  stateport-product-data: {}
