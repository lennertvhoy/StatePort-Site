<svg id="my-svg" width="517.2109375" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 517.211px; background-color: transparent;" viewBox="0 -0.000003814697265625 517.2109375 388.90740966796875" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">Canonical state is the only truth; everything else is a projection</title><desc id="chart-desc-my-svg">Canonical state is the only truth. The conversation, file and preview, terminal, and dashboard views, and a compiled model context, are all derived from it. The model context is bounded, task-scoped, and disposable; it is consumed once and discarded. Model output never writes state directly.</desc><style>#my-svg{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#15213d;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#eef2fb;}#my-svg .error-text{fill:#110d04;stroke:#110d04;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#155fdc;stroke:#155fdc;}#my-svg .marker.cross{stroke:#155fdc;}#my-svg svg{font-family:Arial,Helvetica,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .label{font-family:Arial,Helvetica,sans-serif;color:#15213d;}#my-svg .cluster-label text{fill:#15213d;}#my-svg .cluster-label span{color: